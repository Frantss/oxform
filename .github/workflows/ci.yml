name: ci

on:
  push:
  pull_request:
    branches: [codex/extension-api-rebuild]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache playwright
        uses: actions/cache@v6
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell

      # The steps after the build run when an earlier check fails, so one run shows all failures.
      - name: Build
        id: build
        run: pnpm run build

      - name: Check (fmt + lint + types)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run check

      - name: Check package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run check:package

      - name: Test coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test:coverage

      - name: Run tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test
