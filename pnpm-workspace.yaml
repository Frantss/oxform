packages:
  - apps/*
  - packages/*
  - examples/*

catalogs:
  oxform:
    typescript: 7.0.2
    publint: 0.3.25
    vite-plus: 1.4.0

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    vite: 1.4.0

minimumReleaseAgeExclude:
