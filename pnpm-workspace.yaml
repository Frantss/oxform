packages:
  - apps/*
  - packages/*
  - examples/*

catalogs:
  oxform:
    typescript: 7.0.2
    publint: 0.3.25
    vite-plus: 1.0.0

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    vite: 1.0.0

minimumReleaseAgeExclude:
  - '@types/node@26.6.4'
  - fumadocs-core@16.15.18
  - fumadocs-mdx@15.4.6
  - fumadocs-ui@16.15.18
  - lucide-react@1.50.0
